<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Gotet world harness (dev only)</title>
    <link rel="icon" href="data:," />
    <!-- DEV-ONLY: mounts just the world shell so the Gotet world can be tested while other agents' sections are mid-edit.
         Delete before shipping (with _harness.tsx and _vite.dev.mjs); the production build only uses index.html. -->
    <script>
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          if (window.localStorage.getItem('pm-motion') === 'paused') root.setAttribute('data-motion', 'paused')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/worlds/concept-brand/_harness.tsx"></script>
  </body>
</html>
