<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pau Monfort — Graphic designer, illustrator &amp; front-end developer</title>
    <meta
      name="description"
      content="Portfolio of Pau Monfort Judici: branding, editorial design, illustration and web. Based in Barcelona, worked in Sydney. Open for freelance projects."
    />
    <meta name="theme-color" content="#0e0912" />
    <meta name="author" content="Pau Monfort Judici" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pau Monfort — Graphic designer, illustrator &amp; front-end developer" />
    <meta
      property="og:description"
      content="Ten folders, ten different worlds: branding, editorial design, illustration and web by Pau Monfort Judici."
    />

    <meta property="og:image" content="https://paumonfortjudici.github.io/og.jpg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://paumonfortjudici.github.io/" />

    <!-- Motion + script switches, set before first paint:
         html.js        -> hidden/initial animation states are only written under it, so no-JS visitors see everything
         html[data-motion="paused"] -> the visitor's "Pause motion" choice (localStorage 'pm-motion') -->
    <script>
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          if (window.localStorage.getItem('pm-motion') === 'paused') root.setAttribute('data-motion', 'paused')
        } catch (e) {}
      })()
    </script>

    <!-- The three faces used above the fold (latin subsets, see src/styles/fonts.css). Nothing else is preloaded. -->
    <link rel="preload" href="/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/karla-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/courier-prime-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pau Monfort — graphic designer, illustrator and front-end developer. Please enable JavaScript to open the portfolio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
